syntax = "proto3";

package longntv.user.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "longntv/user/v1/address.proto";
import "longntv/user/v1/user.proto";

// UserService manages users and their addresses.
service UserService {
  // Gets a user. NOT_FOUND if it does not exist.
  rpc GetUser(GetUserRequest) returns (User);
  // Lists users, newest first.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // Creates a user. ALREADY_EXISTS if the email or user_id is taken.
  rpc CreateUser(CreateUserRequest) returns (User);
  // Updates the fields listed in update_mask.
  rpc UpdateUser(UpdateUserRequest) returns (User);
  // Deletes a user. FAILED_PRECONDITION if it has addresses and force is false.
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty);

  // Gets an address.
  rpc GetAddress(GetAddressRequest) returns (Address);
  // Lists the addresses of a user.
  rpc ListAddresses(ListAddressesRequest) returns (ListAddressesResponse);
  // Creates an address under a user.
  rpc CreateAddress(CreateAddressRequest) returns (Address);
  // Updates the fields listed in update_mask.
  rpc UpdateAddress(UpdateAddressRequest) returns (Address);
  // Deletes an address.
  rpc DeleteAddress(DeleteAddressRequest) returns (google.protobuf.Empty);
}

// Request for GetUser.
message GetUserRequest {
  // Required. e.g. `users/alice`.
  // @gotags: validate:"required,startswith=users/"
  string name = 1;
}

// Request for ListUsers.
message ListUsersRequest {
  // Max results per page (default 50, max 1000).
  // @gotags: validate:"gte=0,lte=1000"
  int32 page_size = 1;
  // next_page_token from the previous response.
  string page_token = 2;
}

// Response for ListUsers.
message ListUsersResponse {
  // The users.
  repeated User users = 1;
  // Empty when there are no more pages.
  string next_page_token = 2;
}

// Request for CreateUser.
message CreateUserRequest {
  // Required. The user to create.
  // @gotags: validate:"required"
  User user = 1;
  // Optional ID, becomes `users/{user_id}`. Generated when empty.
  // @gotags: validate:"omitempty,hostname_rfc1123,max=63"
  string user_id = 2;
}

// Request for UpdateUser.
message UpdateUserRequest {
  // Required. user.name selects the user to update.
  User user = 1;
  // Fields to update, e.g. `display_name`.
  google.protobuf.FieldMask update_mask = 2;
}

// Request for DeleteUser.
message DeleteUserRequest {
  // Required. e.g. `users/alice`.
  // @gotags: validate:"required,startswith=users/"
  string name = 1;
  // Also delete the user's addresses.
  bool force = 2;
}

// Request for GetAddress.
message GetAddressRequest {
  // Required. e.g. `users/alice/addresses/home`.
  // @gotags: validate:"required,startswith=users/,contains=/addresses/"
  string name = 1;
}

// Request for ListAddresses.
message ListAddressesRequest {
  // Required. The owning user, e.g. `users/alice`.
  // @gotags: validate:"required,startswith=users/"
  string parent = 1;
  // Max results per page (default 50, max 1000).
  // @gotags: validate:"gte=0,lte=1000"
  int32 page_size = 2;
  // next_page_token from the previous response.
  string page_token = 3;
}

// Response for ListAddresses.
message ListAddressesResponse {
  // The addresses.
  repeated Address addresses = 1;
  // Empty when there are no more pages.
  string next_page_token = 2;
}

// Request for CreateAddress.
message CreateAddressRequest {
  // Required. The owning user, e.g. `users/alice`.
  // @gotags: validate:"required,startswith=users/"
  string parent = 1;
  // Required. The address to create.
  // @gotags: validate:"required"
  Address address = 2;
  // Optional ID, becomes `users/{user}/addresses/{address_id}`.
  // @gotags: validate:"omitempty,hostname_rfc1123,max=63"
  string address_id = 3;
}

// Request for UpdateAddress.
message UpdateAddressRequest {
  // Required. address.name selects the address to update.
  Address address = 1;
  // Fields to update.
  google.protobuf.FieldMask update_mask = 2;
}

// Request for DeleteAddress.
message DeleteAddressRequest {
  // Required. e.g. `users/alice/addresses/home`.
  // @gotags: validate:"required,startswith=users/,contains=/addresses/"
  string name = 1;
}

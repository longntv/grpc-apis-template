name: API change request
description: Propose a new API, RPC, field, or a new API version.
labels: [api-change]
body:
  - type: input
    id: package
    attributes:
      label: Proto package
      placeholder: longntv.user.v1
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: Messages / fields / RPCs to add or change. A proto snippet is ideal.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Motivation and consumers
      description: Which services need this, and why?
    validations:
      required: true
  - type: dropdown
    id: compat
    attributes:
      label: Compatibility
      options:
        - Backward compatible (new RPC / field / service)
        - Breaking (needs a new package version, e.g. v2)
    validations:
      required: true
